<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; overflow: hidden; background: #000; }
  body, html { width: 1920px; height: 1080px; }
  video {
    width: 1920px;
    height: 1080px;
    object-fit: cover;
    display: block;
  }
</style>
</head>
<body>
<video id="v" muted playsinline preload="auto"></video>
<script>
  const video = document.getElementById('v');
  // Use relative path or base64 or file URL
  video.src = '../assets/video/project-1.mp4';
  
  video.addEventListener('loadeddata', () => {
    // Seek to a cinematic frame around 3.5 seconds into the reel
    video.currentTime = 3.5;
  });

  video.addEventListener('seeked', () => {
    // Add class or signal ready
    document.title = 'FRAME_READY';
  });
</script>
</body>
</html>
