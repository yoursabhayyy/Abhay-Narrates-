<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Cinematic Gradients -->
    <radialGradient id="cinematicGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1A1F26" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0E1014" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050608" stop-opacity="1"/>
    </radialGradient>
    
    <linearGradient id="anamorphicStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A6073" stop-opacity="0"/>
      <stop offset="45%" stop-color="#3A8891" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#E2F6FF" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#3A8891" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3A6073" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="vignetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.75"/>
      <stop offset="15%" stop-color="#000" stop-opacity="0.1"/>
      <stop offset="85%" stop-color="#000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="#0A0A0A"/>
  <rect width="1920" height="1080" fill="url(#cinematicGlow)"/>

  <!-- Subtle Horizon Silhouette / Film Setting -->
  <g opacity="0.35">
    <path d="M 0 740 Q 480 690 960 720 T 1920 700 L 1920 1080 L 0 1080 Z" fill="#07080A"/>
    <path d="M 0 790 Q 600 750 1200 780 T 1920 770 L 1920 1080 L 0 1080 Z" fill="#040507"/>
  </g>

  <!-- Anamorphic Light Streak -->
  <rect x="0" y="440" width="1920" height="4" fill="url(#anamorphicStreak)"/>
  <circle cx="960" cy="442" r="180" fill="#437682" opacity="0.08" filter="blur(40px)"/>

  <!-- Vignette -->
  <rect width="1920" height="1080" fill="url(#vignetteGrad)"/>

  <!-- Camera HUD / Viewfinder Frame -->
  <g stroke="#F2F2F2" stroke-opacity="0.2" stroke-width="1.5" fill="none">
    <!-- Center Target -->
    <path d="M 940 540 L 980 540 M 960 520 L 960 560" />
    
    <!-- Framing Corners -->
    <path d="M 120 160 L 120 120 L 160 120" />
    <path d="M 1800 120 L 1760 120 M 1800 120 L 1800 160" />
    <path d="M 120 920 L 120 960 L 160 960" />
    <path d="M 1800 960 L 1760 960 M 1800 960 L 1800 920" />
  </g>

  <!-- Camera HUD Meta Information -->
  <g font-family="'JetBrains Mono', monospace" font-size="14" fill="#F2F2F2" opacity="0.65" letter-spacing="2">
    <text x="160" y="145">REC</text>
    <circle cx="145" cy="140" r="5" fill="#E53935"/>
    <text x="230" y="145">4K RAW · 24.00 FPS</text>
    
    <text x="1760" y="145" text-anchor="end">SHUTTER 1/48 · ISO 800</text>
    <text x="160" y="945">TIMECODE [ 01:14:22:08 ]</text>
    <text x="1760" y="945" text-anchor="end">PR: SEQ_01_HERO_V3</text>
  </g>

  <!-- Title Center Overlay -->
  <g text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif">
    <text x="960" y="525" font-size="28" font-weight="600" fill="#F2F2F2" letter-spacing="8" opacity="0.9">ABHAY — THE BEGINNING</text>
    <text x="960" y="565" font-family="'Inter', sans-serif" font-size="14" fill="#858585" letter-spacing="3" opacity="0.8">CINEMATIC INTRO · 2026</text>
  </g>
</svg>
